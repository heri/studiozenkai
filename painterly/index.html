<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painterly field cards</title>
<meta name="theme-color" content="#141c26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painterly">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#141c26;      /* blue-black */
  --wall:#1a2230;
  --panel:#1e2835;
  --line:#2e3a48;
  --ink:#ece3cf;         /* lead white */
  --ink-2:#a89e8a;
  --gold:#caa04a;
  --green:#4b7a5e;
  --madder:#a8493c;
  --display:"IM Fell English", Georgia, "Times New Roman", serif;
  --text:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.5 var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto}

/* Header: the light of the day */
.top{padding:10px 16px 8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.status{font:italic 400 1.15rem/1.2 var(--display);color:var(--ink)}
.status small{display:block;font:400 .85rem/1.3 var(--text);color:var(--ink-2);font-style:normal;margin-top:2px}
.icon-btn{min-width:44px;height:44px;border-radius:22px;border:1px solid var(--line);padding:0 14px;font-size:.9rem;color:var(--ink-2);white-space:nowrap}
.icon-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.daybar{position:relative;height:6px;border-radius:3px;background:#2a3544;margin:10px 0 4px;overflow:hidden}
.daybar i{position:absolute;top:0;bottom:0}
.daybar .day{background:#4a5566}
.daybar .golden{background:var(--gold)}
.daybar .blue{background:#4f6f9c}
.daybar .now{width:2px;background:var(--ink);box-shadow:0 0 0 1px var(--ground)}
.times{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.82rem;color:var(--ink-2)}
.times b{font-weight:500;color:var(--ink)}
.times .g::before,.times .bl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--gold);vertical-align:1px}
.times .bl::before{background:#4f6f9c}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;height:38px;border-radius:19px;color:var(--ink-2);font-size:.95rem}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink)}

/* Deck */
.stage{position:relative;overflow:hidden;padding:4px 12px 0}
.deck{position:relative;height:100%}
.card{position:absolute;inset:0;background:var(--wall);border-radius:14px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;will-change:transform;box-shadow:0 18px 40px rgba(5,8,12,.55)}
.card.under{transform:scale(.955) translateY(10px);filter:brightness(.7);pointer-events:none}
.card.fling{transition:transform .32s ease-in, opacity .32s ease-in}
.card.snap{transition:transform .22s ease-out}
.stamp{position:sticky;top:14px;height:0;z-index:3;pointer-events:none}
.stamp span{position:absolute;top:0;padding:4px 14px;border:2px solid;border-radius:6px;font:italic 1.6rem/1 var(--display);opacity:0;background:rgba(20,28,38,.6)}
.stamp .keep{left:16px;color:#8fd0a8;border-color:#8fd0a8;transform:rotate(-8deg)}
.stamp .skip{right:16px;color:#e3968a;border-color:#e3968a;transform:rotate(8deg)}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;color:var(--ink-2)}
.empty h2{font:italic 400 1.7rem/1.2 var(--display);color:var(--ink);margin:0}
.btn{height:46px;padding:0 22px;border-radius:23px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1409;font-weight:500}

/* Card content */
.plate{margin:0;padding:20px 22px 0;display:flex;flex-direction:column;align-items:center}
.plate .frame{position:relative;width:100%;height:min(40vh,440px);display:flex;align-items:center;justify-content:center}
.plate img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 6px #2a2118,0 0 0 7px #6b5530,0 14px 30px rgba(0,0,0,.6);background:#2a2118}
.plate .missing{position:absolute;inset:8% 10%;display:none;align-items:flex-end;padding:14px;border-radius:2px;color:rgba(236,227,207,.85);font-size:.85rem}
.plate.no-img img{display:none}
.plate.no-img .missing{display:flex}
.plate figcaption{margin-top:12px;font-size:.82rem;color:var(--ink-2);text-align:center;line-height:1.35;min-height:3.4em}
.plate figcaption em{font-family:var(--display);font-size:.98rem;color:var(--ink)}
.plate figcaption a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:2px}
.plate .tap{position:absolute;top:0;bottom:0;width:50%;z-index:1;-webkit-tap-highlight-color:transparent}
.plate .tap.prev{left:0}
.plate .tap.next{right:0}
.pips{display:flex;gap:5px;width:min(100%,220px);margin-top:18px}
.pips i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink)}
.plate .kind{margin-top:8px;font:500 .72rem/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}

/* Setup plan */
.plan{margin:4px 0 14px}
.plan svg{display:block;width:100%;max-width:400px;margin:0 auto;background:var(--panel);border-radius:10px}
.plan figcaption{font-size:.85rem;color:var(--ink-2);margin-top:8px;line-height:1.4}
.pl-fov{fill:rgba(236,227,207,.05)}
.pl-axis{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.pl-dim{fill:var(--ink-2);font:400 11px var(--text)}
.pl-lab{fill:var(--ink);font:400 12px var(--text)}
.pl-zone{fill:none;stroke:var(--ink-2);stroke-width:6;stroke-linecap:round;opacity:.25}
.pl-zlab{fill:var(--ink-2);font:italic 400 13px var(--display)}
.pl-beam{stroke:none;opacity:.2}
.pl-beam.window,.pl-beam.sky{fill:#b9cde6}
.pl-beam.sun{fill:#e9b949;opacity:.28}
.pl-beam.lantern{stroke:#e89a3c;stroke-width:14;opacity:.2}
.pl-window{stroke:#b9cde6;stroke-width:5;stroke-linecap:round}
.pl-sky{stroke:#b9cde6;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round}
.pl-sun circle{fill:#e9b949}
.pl-sun line{stroke:#e9b949;stroke-width:2;stroke-linecap:round}
.pl-lantern{fill:#e89a3c}
.pl-mod{stroke-width:5;stroke-linecap:round}
.pl-mod.black{stroke:#06090d;filter:drop-shadow(0 0 1px #5a6676)}
.pl-mod.white{stroke:var(--ink)}
.pl-mod.gold{stroke:var(--gold)}
.pl-arc{fill:none;stroke:var(--gold);stroke-width:1.2}
.pl-deg{fill:var(--gold);font:500 11px var(--text)}
.pl-body{fill:#5a6676}
.pl-head{fill:var(--ink)}
.pl-gaze{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:2 3}
.pl-cam rect{fill:var(--ink-2)}

.body{padding:18px 22px 36px}
.title{font:italic 400 2.15rem/1.08 var(--display);margin:0;letter-spacing:.005em}
.mood{margin:8px 0 0;color:var(--ink-2);font-size:1.02rem}
.swatches{display:flex;margin-top:14px;height:14px;border-radius:2px;overflow:hidden;max-width:220px}
.swatches span{flex:1}
.glance{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:18px 0 4px;padding:14px 16px;background:var(--panel);border-radius:10px;font-size:.95rem}
.glance dt{color:var(--ink-2)}
.glance dd{margin:0}

.sec{margin-top:26px}
.sec h3{font:italic 400 1.3rem/1.2 var(--display);color:var(--gold);margin:0 0 8px}
.sec h4{font:500 .92rem/1.3 var(--text);color:var(--ink-2);margin:14px 0 6px}
.sec p{margin:0 0 8px;max-width:62ch}
.plain{margin:0;padding-left:1.1em}
.plain li{margin:4px 0}
.prompts{margin:6px 0 0;padding:0;list-style:none}
.prompts li{font-family:var(--display);font-style:italic;font-size:1.08rem;padding:6px 0 6px 14px;border-left:2px solid var(--line);margin:4px 0}
.steps{margin:0;padding-left:1.3em}
.steps li{margin:6px 0;padding-left:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}

.checks{list-style:none;margin:0;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;flex:0 0 22px;height:22px;margin:1px 0 0;border:1.5px solid #5a6676;border-radius:4px;display:grid;place-content:center;background:transparent}
.checks input::after{content:"";width:11px;height:6px;border:2px solid #1a1409;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.checks input:checked{background:var(--gold);border-color:var(--gold)}
.checks input:checked::after{opacity:1}
.checks input:checked + span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(168,158,138,.5)}
.checks .k{color:var(--ink-2);margin-right:6px}
.progress{font:400 .85rem var(--text);color:var(--ink-2);margin-left:8px;font-style:normal}
.card-foot{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}

/* Action bar */
.actions{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px 16px 14px}
.act{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--ink-2)}
.act svg{width:26px;height:26px}
.act.skip{color:#e3968a;border-color:#5d3a37}
.act.keep{color:#8fd0a8;border-color:#35594a}
.act.undo{width:46px;height:46px}
.act:disabled{opacity:.35}
.hidden{display:none !important}

/* Kept & all list */
.list{height:100%;overflow-y:auto;padding:4px 16px 24px}
.list h2{font:italic 400 1.35rem/1.2 var(--display);margin:18px 0 8px;color:var(--gold)}
.list p.note{color:var(--ink-2);margin:0 0 8px;font-size:.95rem}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.row .thumb{flex:0 0 58px;height:58px;border-radius:4px;background:#2a2118 center/cover no-repeat}
.row .t{font:italic 400 1.15rem/1.2 var(--display)}
.row .s{font-size:.85rem;color:var(--ink-2)}
.row .tag{margin-left:auto;font-size:.8rem;color:var(--gold)}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(6,9,13,.6);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;z-index:11;
  padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sheet h2{font:italic 400 1.5rem/1.2 var(--display);margin:0 0 4px}
.sheet .group{margin-top:18px}
.sheet .group > span{display:block;color:var(--ink-2);font-size:.9rem;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);color:var(--ink);font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1409}
.sheet .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.sheet .small{font-size:.88rem;color:var(--ink-2);margin:8px 0 0}

.reader{position:fixed;inset:0;z-index:12;background:var(--ground);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.reader .card{position:relative;inset:auto;flex:1;border-radius:0;box-shadow:none;max-width:560px;width:100%;margin:0 auto}

@media (prefers-reduced-motion: reduce){
  .card.fling,.card.snap{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="status" id="status">Reading the light<small>&nbsp;</small></div>
      <button class="icon-btn" id="openFilters" aria-haspopup="dialog">Conditions</button>
    </div>
    <div class="daybar" id="daybar" aria-hidden="true"></div>
    <div class="times" id="times"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabDeck" aria-selected="true">Deck</button>
      <button class="tab" role="tab" id="tabKept" aria-selected="false">Kept</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="deck" id="deck"></div>
    <div class="list hidden" id="list"></div>
  </main>

  <footer class="actions" id="actions">
    <button class="act undo" id="undo" aria-label="Undo last swipe" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="act skip" id="skip" aria-label="Skip this card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="act keep" id="keep" aria-label="Keep this card for today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>
    </button>
  </footer>
</div>

<script src="cards.js"></script>
<script>
(() => {
"use strict";
const CARDS = window.CARDS || [];
const KEY = "painterly.v1";
const HOME = { lat: 45.5017, lon: -73.5673, label: "Montréal" };
const GROUPS = [
  ["style", "Painting style", [["masters","Old masters"],["impressionism","Impressionism"],["pointillism","Pointillism"]]],
  ["subject", "Who's in front of the camera", [["kids","Kids"],["adults","Adults"],["family","Family group"],["none","No people"]]],
  ["place", "Where you are", [["water","By the water"],["street","City streets"],["farm","Farm and fields"],["hills","Hills and mountains"],["forest","Forest"],["garden","Garden or park"],["indoors","Indoors and doorways"]]],
  ["light", "Light", [["golden","Golden hour"],["blue","Blue hour"],["day","Daytime"],["night","After dark"]]],
  ["weather", "Weather", [["clear","Clear"],["overcast","Overcast"],["fog","Fog or mist"],["snow","Snow"],["storm","Storm clearing"]]],
  ["season", "Season", [["spring","Spring"],["summer","Summer"],["autumn","Autumn"],["winter","Winter"]]],
  ["lens", "Lenses in your bag", [["c35","Contax 35mm"],["gf80","GF 80mm"],["c135","Canon 135mm"],["c140","Contax 140mm"],["c210","Contax 210mm"],["c300","Canon 300mm"]]]
];
// Lens tags come from each card's own lens line and kit list, so new cards are covered automatically.
const LENS_RE = { c35: /\b35mm/, gf80: /\b80mm/, c135: /\b135mm/, c140: /\b140mm/, c210: /\b210mm/, c300: /\b300mm/ };
for (const c of CARDS) c.tags.lens = Object.keys(LENS_RE).filter(k => [c.glance.lens, ...c.kit].some(s => LENS_RE[k].test(s)));

/* ---------- state ---------- */
function defaults(){ return { kept:[], skipped:[], history:[], checks:{}, filters:{style:[],subject:[],place:[],light:[],weather:[],season:[],lens:[]}, matchNow:false, loc:null, img:{} }; }
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = defaults(); }
S.filters = Object.assign(defaults().filters, S.filters);   // groups added since the phone last saved
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const byId = id => CARDS.find(c => c.id === id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

/* ---------- sun ---------- */
const RAD = Math.PI/180;
function sunAlt(date, lat, lon){
  const d = date.getTime()/86400000 - 10957.5;             // days since J2000
  const g = (357.529 + 0.98560028*d) * RAD;
  const q = 280.459 + 0.98564736*d;
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * RAD;
  const e = (23.439 - 0.00000036*d) * RAD;
  const ra = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908*d) % 24) * 15 * RAD;
  const H = gmst + lon*RAD - ra;
  return Math.asin(Math.sin(lat*RAD)*Math.sin(dec) + Math.cos(lat*RAD)*Math.cos(dec)*Math.cos(H)) / RAD;
}
function phaseOf(alt){ return alt > 6 ? "day" : alt >= -4 ? "golden" : alt >= -8 ? "blue" : "night"; }
function dayPlan(loc){
  const start = new Date(); start.setHours(0,0,0,0);
  const mins = []; for (let m = 0; m <= 1440; m += 2) mins.push([m, phaseOf(sunAlt(new Date(start.getTime()+m*60000), loc.lat, loc.lon))]);
  const segs = []; let cur = null;
  for (const [m,p] of mins){ if (!cur || cur.p !== p){ cur = {p, a:m, b:m}; segs.push(cur); } else cur.b = m; }
  return { start, segs };
}
const fmt = new Intl.DateTimeFormat(undefined, { hour:"numeric", minute:"2-digit" });
const tAt = (start, m) => fmt.format(new Date(start.getTime()+m*60000));
function dur(ms){ const m = Math.round(ms/60000); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`; }

let currentPhase = "day";
function renderLight(){
  const loc = S.loc || HOME;
  const now = new Date();
  const alt = sunAlt(now, loc.lat, loc.lon);
  currentPhase = phaseOf(alt);
  const { start, segs } = dayPlan(loc);
  const nowM = (now - start)/60000;
  const names = { golden:"Golden hour", blue:"Blue hour", day:"Daylight", night:"Night" };

  // status line
  let head = names[currentPhase] + " now";
  let sub = "";
  const next = segs.find(s => s.a > nowM && s.p === "golden");
  const curSeg = segs.find(s => nowM >= s.a && nowM <= s.b);
  if (currentPhase === "golden" || currentPhase === "blue") sub = `Ends in ${dur((curSeg.b - nowM)*60000)}`;
  else if (next) sub = `Golden hour in ${dur((next.a - nowM)*60000)}`;
  else sub = "Golden hour tomorrow morning";
  document.getElementById("status").innerHTML = `${esc(head)}<small>${esc(sub)} in ${esc(loc.label)}</small>`;

  // bar
  const bar = document.getElementById("daybar");
  bar.innerHTML = segs.filter(s => s.p !== "night").map(s =>
    `<i class="${s.p}" style="left:${s.a/14.4}%;width:${Math.max(.4,(s.b-s.a)/14.4)}%"></i>`).join("")
    + `<i class="now" style="left:${nowM/14.4}%"></i>`;

  // times
  const golds = segs.filter(s => s.p === "golden"), blues = segs.filter(s => s.p === "blue");
  const parts = [];
  const r = s => `<b>${tAt(start,s.a)}–${tAt(start,s.b)}</b>`;
  if (golds[0]) parts.push(`<span class="g">Morning ${r(golds[0])}</span>`);
  if (golds[1]) parts.push(`<span class="g">Evening ${r(golds[1])}</span>`);
  if (blues[1]) parts.push(`<span class="bl">Blue ${r(blues[1])}</span>`);
  document.getElementById("times").innerHTML = parts.join("");
}

/* ---------- paintings ---------- */
let LOCAL = new Set();
fetch("img/index.json").then(r => r.ok ? r.json() : []).then(ids => { LOCAL = new Set(ids); refreshImages(); }).catch(() => {});

const pending = {};
function paintingURL(c){
  if (S.img[c.id]) return Promise.resolve(S.img[c.id]);
  if (pending[c.id]) return pending[c.id];
  pending[c.id] = (async () => {
    for (const t of c.painting.wiki || []){
      try {
        const u = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1400&titles=${encodeURIComponent(t)}`;
        const j = await (await fetch(u)).json();
        const p = Object.values(j.query?.pages || {})[0];
        if (p?.thumbnail?.source){ S.img[c.id] = p.thumbnail.source; save(); return p.thumbnail.source; }
      } catch(e){}
    }
    try {
      const u = `https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=1&gsrsearch=${encodeURIComponent(c.painting.commons + " filetype:bitmap")}&prop=imageinfo&iiprop=url&iiurlwidth=1400`;
      const j = await (await fetch(u)).json();
      const p = Object.values(j.query?.pages || {})[0];
      const src = p?.imageinfo?.[0]?.thumburl;
      if (src){ S.img[c.id] = src; save(); return src; }
    } catch(e){}
    return null;
  })().finally(() => { delete pending[c.id]; });
  return pending[c.id];
}
function loadImg(img, c){
  const fig = img.closest(".plate, .row");
  const fail = () => fig && fig.classList.add("no-img");
  if (LOCAL.has(c.id)){ img.onerror = () => { img.onerror = null; remote(); }; img.src = `img/${c.id}.jpg`; return; }
  remote();
  function remote(){
    paintingURL(c).then(url => {
      if (!url) return fail();
      img.onerror = () => { img.onerror = fail; delete S.img[c.id]; save(); paintingURL(c).then(u2 => u2 && u2 !== url ? img.src = u2 : fail()); };
      img.src = url;
    });
  }
}
function refreshImages(){ document.querySelectorAll("img[data-card]").forEach(img => { const c = byId(img.dataset.card); if (c && !c.images && !img.complete) loadImg(img, c); }); }

/* ---------- gallery: several paintings and photos per card ---------- */
const gallery = c => c.images || [{ kind: "painting", legacy: true, ...c.painting }];
const firstSrc = c => c.images ? Promise.resolve(`img/${c.images[0].file}`) : LOCAL.has(c.id) ? Promise.resolve(`img/${c.id}.jpg`) : paintingURL(c);
const UTM = "utm_source=painterly_field_cards&utm_medium=referral";
function credit(im){
  if (im.kind === "photo") return `Photograph by <a href="https://unsplash.com/photos/${esc(im.unsplash)}?${UTM}" target="_blank" rel="noopener">${esc(im.by)}</a>
    on <a href="https://unsplash.com/?${UTM}" target="_blank" rel="noopener">Unsplash</a>`;
  return `<em>${esc(im.title)}</em><br>${esc(im.artist)}, ${esc(im.year)}<br>${esc(im.museum)}`;
}
const altText = im => im.kind === "photo" ? `Reference photograph by ${im.by}` : `${im.title} by ${im.artist}`;
function showImage(fig, c, i){
  const ims = gallery(c);
  i = (i + ims.length) % ims.length;
  const im = ims[i], img = fig.querySelector("img");
  fig.dataset.i = i;
  fig.classList.remove("no-img");
  fig.querySelector("figcaption").innerHTML = credit(im);
  fig.querySelectorAll(".pips i").forEach((p, k) => p.classList.toggle("on", k === i));
  const kind = fig.querySelector(".kind"); if (kind) kind.textContent = im.kind === "photo" ? "Photograph" : "Painting";
  img.alt = altText(im);
  if (im.legacy) return loadImg(img, c);
  img.onerror = () => fig.classList.add("no-img");
  img.src = `img/${im.file}`;
  const next = ims[(i + 1) % ims.length]; if (next.file) new Image().src = `img/${next.file}`;
}
function plateHTML(c){
  const ims = gallery(c), many = ims.length > 1;
  return `<figure class="plate" data-gal="${c.id}">
    <div class="frame"><img data-card="${c.id}" decoding="async">
      <div class="missing" style="background:linear-gradient(160deg, ${c.palette.join(",")})">Image not loaded yet. It appears once you're online.</div>
      ${many ? `<button class="tap prev" data-step="-1" aria-label="Previous image"></button><button class="tap next" data-step="1" aria-label="Next image"></button>` : ""}
    </div>
    ${many ? `<div class="pips" aria-hidden="true">${ims.map(() => "<i></i>").join("")}</div><span class="kind"></span>` : ""}
    <figcaption></figcaption>
  </figure>`;
}
function initPlate(root, c){ const fig = root.querySelector(".plate"); if (fig) showImage(fig, c, 0); }

/* ---------- setup plan: top-down diagram of camera, subject and light ---------- */
const PLAN_W = 360, PLAN_H = 290, PX = 180, PY = 150;
const clockPt = (h, r) => { const a = h / 12 * 2 * Math.PI; return [PX + r * Math.sin(a), PY - r * Math.cos(a)]; };
const planR = d => Math.min(118, 34 + 34 * Math.sqrt(d));   // schematic: near things spread out, far things pinned to the rim
const f1 = n => Math.round(n * 10) / 10;
const boxOf = (anchor, lx, ly, wide, tall) => {
  const x0 = anchor === "start" ? lx : anchor === "end" ? lx - wide : lx - wide / 2;
  return [x0, ly - 10, x0 + wide, ly + tall + 3];
};
const overlaps = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
function planLabel(x, y, h, text, gap, taken){
  // Wrap to short lines, then try beside the icon, above it and below it (outward side first),
  // keeping the first spot that stays inside the drawing and clear of labels already placed.
  const words = String(text).split(" "), lines = [""];
  for (const w of words){ const l = lines[lines.length-1]; if (l && (l + " " + w).length > 14 && lines.length < 3) lines.push(w); else lines[lines.length-1] = l ? l + " " + w : w; }
  const s = Math.sin(h / 6 * Math.PI), co = Math.cos(h / 6 * Math.PI);
  const wide = Math.max(...lines.map(l => l.length)) * 6, tall = (lines.length - 1) * 13;
  const mid = Math.min(Math.max(x, wide / 2 + 4), PLAN_W - wide / 2 - 4);
  const above = ["middle", mid, y - gap - tall], below = ["middle", mid, y + gap + 10];
  const spots = [];
  if (Math.abs(s) > .35) spots.push([s > 0 ? "start" : "end", x + Math.sign(s) * gap, y - tall / 2 + 4]);
  spots.push(...(co >= 0 ? [above, below] : [below, above]));
  const inside = b => b[0] >= 2 && b[2] <= PLAN_W - 2 && b[1] >= 2 && b[3] <= PLAN_H - 2;
  const pick = spots.find(sp => { const b = boxOf(sp[0], sp[1], sp[2], wide, tall); return inside(b) && !taken.some(t => overlaps(b, t)); })
    || spots.find(sp => inside(boxOf(sp[0], sp[1], sp[2], wide, tall))) || spots[0];
  const [anchor, lx, ly] = pick;
  taken.push(boxOf(anchor, lx, ly, wide, tall));
  return `<text class="pl-lab" x="${f1(lx)}" y="${f1(ly)}" text-anchor="${anchor}">${lines.map((l, k) => `<tspan x="${f1(lx)}" dy="${k ? 13 : 0}">${esc(l)}</tspan>`).join("")}</text>`;
}
function barAcross(h, r, len){
  // A short segment perpendicular to the line toward the subject (window, flag, reflector).
  const [x, y] = clockPt(h, r), a = h / 6 * Math.PI, dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
  return [[x - dx, y - dy], [x + dx, y + dy], [x, y]];
}
function planSVG(c){
  const p = c.plan;
  const out = [], taken = [];   // taken: label boxes already placed
  const camR = planR(p.camera.dist), [camX, camY] = clockPt(6, camR);
  const mm = +(/(\d+)\s*mm/.exec(c.glance.lens) || [])[1];
  const hfov = mm ? 2 * Math.atan(43.8 / (2 * mm)) : 0;          // GFX sensor width

  // Lens axis and field of view
  if (hfov){
    const L = camR + 40, t = Math.tan(hfov / 2) * L;
    out.push(`<path class="pl-fov" d="M${f1(camX)} ${f1(camY)} L${f1(camX - t)} ${f1(camY - L)} L${f1(camX + t)} ${f1(camY - L)}Z"/>`);
  }
  out.push(`<line class="pl-axis" x1="${PX}" y1="${PY}" x2="${f1(camX)}" y2="${f1(camY)}"/>`);
  out.push(`<text class="pl-dim" x="${PX + 8}" y="${f1((PY + camY) / 2 + 12)}">${esc(p.camera.dist)} m</text>`);

  // Zones: what lies in that direction
  for (const z of p.zones || []){
    const a0 = (z.at - .9) / 6 * Math.PI, a1 = (z.at + .9) / 6 * Math.PI, R = 138;
    const P = a => [PX + R * Math.sin(a), PY - R * Math.cos(a)];
    const [x0, y0] = P(a0), [x1, y1] = P(a1);
    out.push(`<path class="pl-zone" d="M${f1(x0)} ${f1(y0)} A${R} ${R} 0 0 1 ${f1(x1)} ${f1(y1)}"/>`);
    const [lx, ly] = clockPt(z.at, R - 16);
    out.push(`<text class="pl-zlab" x="${f1(lx)}" y="${f1(ly + 4)}" text-anchor="middle">${esc(z.label)}</text>`);
    taken.push(boxOf("middle", lx, ly + 4, z.label.length * 6.5, 0));
  }

  // Light sources, with the light they throw on the subject
  (p.lights || []).forEach((l, k) => {
    const r = l.kind === "sun" ? 126 : planR(l.dist);
    const [x, y] = clockPt(l.at, r);
    if (l.kind === "window" || l.kind === "sky"){
      const [[ax, ay], [bx, by]] = barAcross(l.at, r, l.kind === "sky" ? 64 : 46);
      out.push(`<path class="pl-beam ${l.kind}" d="M${f1(ax)} ${f1(ay)} L${f1(bx)} ${f1(by)} L${PX} ${PY}Z"/>`);
      out.push(`<line class="pl-${l.kind}" x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}"/>`);
    } else if (l.kind === "sun"){
      const [[ax, ay], [bx, by]] = barAcross(l.at, r, 22);
      out.push(`<path class="pl-beam sun" d="M${f1(ax)} ${f1(ay)} L${f1(bx)} ${f1(by)} L${PX} ${PY}Z"/>`);
      out.push(`<g class="pl-sun">${[0,1,2,3,4,5,6,7].map(i => { const a = i * Math.PI / 4;
        return `<line x1="${f1(x + 13 * Math.cos(a))}" y1="${f1(y + 13 * Math.sin(a))}" x2="${f1(x + 18 * Math.cos(a))}" y2="${f1(y + 18 * Math.sin(a))}"/>`; }).join("")}
        <circle cx="${f1(x)}" cy="${f1(y)}" r="9"/></g>`);
    } else {
      out.push(`<path class="pl-beam lantern" d="M${f1(x)} ${f1(y)} L${PX} ${PY}"/><circle class="pl-lantern" cx="${f1(x)}" cy="${f1(y)}" r="7"/>`);
    }
    out.push(planLabel(x, y, l.at, l.label, l.kind === "sun" || l.kind === "sky" ? 30 : 20, taken));
    if (k === 0){
      // Angle between the light and the lens axis, the number photographers talk about.
      let d = ((l.at - 6) % 12 + 12) % 12; if (d > 6) d -= 12;
      const deg = Math.round(Math.abs(d) * 30), ar = 30;
      if (deg >= 15){
        const [sx, sy] = clockPt(6, ar), [ex, ey] = clockPt(l.at, ar), [mx, my] = clockPt(6 + d / 2, ar + 13);
        out.push(`<path class="pl-arc" d="M${f1(sx)} ${f1(sy)} A${ar} ${ar} 0 0 ${d > 0 ? 1 : 0} ${f1(ex)} ${f1(ey)}"/>`);
        out.push(`<text class="pl-deg" x="${f1(mx)}" y="${f1(my + 4)}" text-anchor="middle">${deg}°</text>`);
      }
    }
  });

  // Modifiers: flags, reflectors
  for (const m of p.mods || []){
    const r = planR(m.dist), [[ax, ay], [bx, by], [x, y]] = barAcross(m.at, r, 34);
    out.push(`<line class="pl-mod ${m.kind}" x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}"/>`);
    out.push(planLabel(x, y, m.at, m.label, 26, taken));   // 26: clear the diagonal bar's own reach
  }

  // Subject: shoulders across, head, nose pointing where the face points
  const fa = p.subject.facing / 6 * Math.PI, fx = Math.sin(fa), fy = -Math.cos(fa);
  out.push(`<ellipse class="pl-body" cx="${PX}" cy="${PY}" rx="19" ry="8" transform="rotate(${f1(p.subject.facing * 30)} ${PX} ${PY})"/>`);
  out.push(`<line class="pl-gaze" x1="${f1(PX + fx * 12)}" y1="${f1(PY + fy * 12)}" x2="${f1(PX + fx * 30)}" y2="${f1(PY + fy * 30)}"/>`);
  out.push(`<circle class="pl-head" cx="${PX}" cy="${PY}" r="9"/>`);
  out.push(`<path class="pl-head" d="M${f1(PX + fx * 13)} ${f1(PY + fy * 13)} L${f1(PX + fx * 7 - fy * 4)} ${f1(PY + fy * 7 + fx * 4)} L${f1(PX + fx * 7 + fy * 4)} ${f1(PY + fy * 7 - fx * 4)}Z"/>`);

  // Camera, lens toward the subject
  out.push(`<g class="pl-cam"><rect x="${f1(camX - 13)}" y="${f1(camY - 2)}" width="26" height="16" rx="3"/><rect x="${f1(camX - 6)}" y="${f1(camY - 9)}" width="12" height="8" rx="1.5"/></g>`);

  const note = [
    `Seen from above, camera at the bottom.`,
    mm ? `${mm} mm lens: the shaded wedge is what it sees (${Math.round(hfov * 180 / Math.PI)}° wide).` : "",
    p.subject.label ? `Subject: ${p.subject.label.charAt(0).toLowerCase() + p.subject.label.slice(1)}.` : "",
    p.camera.label ? `Camera: ${p.camera.label.charAt(0).toLowerCase() + p.camera.label.slice(1)}.` : ""
  ].filter(Boolean).join(" ");
  return `<figure class="plan"><svg viewBox="0 0 ${PLAN_W} ${PLAN_H}" role="img" aria-label="Setup seen from above. ${esc(note)}">${out.join("")}</svg>
    <figcaption>${esc(note)}</figcaption></figure>`;
}

/* ---------- card rendering ---------- */
function checks(c, sec, items, fn){
  const done = S.checks[c.id] || {};
  return `<ul class="checks">${items.map((it,i) => {
    const k = `${sec}:${i}`;
    return `<li><label><input type="checkbox" data-card="${c.id}" data-key="${k}" ${done[k] ? "checked" : ""}><span>${fn ? fn(it) : esc(it)}</span></label></li>`;
  }).join("")}</ul>`;
}
function progress(c){
  const total = (c.wardrobe.length + c.props.length + c.kit.length + c.settings.length + c.breakers.length);
  const n = Object.values(S.checks[c.id] || {}).filter(Boolean).length;
  return n ? `${n} of ${total} checked` : "";
}
function cardHTML(c){
  const people = c.kind === "Portrait";
  return `
  <div class="stamp" aria-hidden="true"><span class="keep">Keep</span><span class="skip">Skip</span></div>
  ${plateHTML(c)}
  <div class="body">
    <h2 class="title">${esc(c.title)}</h2>
    <p class="mood">${esc(c.mood)}</p>
    <div class="swatches" title="Target palette">${c.palette.map(h => `<span style="background:${h}"></span>`).join("")}</div>
    <dl class="glance">
      <dt>When</dt><dd>${esc(c.glance.when)}</dd>
      <dt>Lens</dt><dd>${esc(c.glance.lens)}</dd>
      <dt>Start at</dt><dd>${esc(c.glance.exposure)}</dd>
    </dl>

    <section class="sec"><h3>What to take from the painting</h3><ul class="plain">${c.steal.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>

    <section class="sec"><h3>When and where</h3><p>${esc(c.when)}</p><p>${esc(c.where)}</p></section>

    <section class="sec"><h3>${people ? "Posing and direction" : "Composition"}</h3>${c.plan ? planSVG(c) : ""}<p>${esc(c.direction.pose)}</p>
      ${c.direction.prompts.length ? `<h4>${people ? "Say this" : "Look for"}</h4><ul class="prompts">${c.direction.prompts.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    </section>

    ${c.wardrobe.length || c.props.length ? `<section class="sec"><h3>Wardrobe and props</h3>
      ${c.wardrobe.length ? `<h4>Clothing</h4>${checks(c,"w",c.wardrobe)}` : ""}
      ${c.props.length ? `<h4>Props</h4>${checks(c,"p",c.props)}` : ""}</section>` : ""}

    <section class="sec"><h3>Light</h3>
      <dl class="kv"><dt>Direction</dt><dd>${esc(c.light.direction)}</dd><dt>Ratio</dt><dd>${esc(c.light.ratio)}</dd></dl>
      <p style="margin-top:8px">${esc(c.light.notes)}</p></section>

    <section class="sec"><h3>Pack</h3>${checks(c,"k",c.kit)}</section>

    <section class="sec"><h3>Camera</h3>${checks(c,"s",c.settings, ([k,v]) => `<span class="k">${esc(k)}</span>${esc(v)}`)}</section>

    <section class="sec"><h3>Before you press the shutter</h3><p style="color:var(--ink-2)">Scan the frame for these.</p>${checks(c,"b",c.breakers)}</section>

    <section class="sec"><h3>If the light doesn't cooperate</h3><p>${esc(c.fallback)}</p><p style="color:var(--ink-2)">${esc(c.duration)}</p></section>

    <section class="sec"><h3>Afterwards</h3><ol class="steps">${c.post.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>

    <div class="card-foot"><button class="btn" data-clear="${c.id}">Clear checkmarks</button><span class="progress" data-prog="${c.id}">${progress(c)}</span></div>
  </div>`;
}

/* ---------- filtering ---------- */
function matches(c){
  for (const [g] of GROUPS){ const sel = S.filters[g]; if (sel.length && !sel.some(v => (c.tags[g] || []).includes(v))) return false; }
  if (S.matchNow && !c.tags.light.includes(currentPhase)) return false;
  return true;
}
const deckCards = () => CARDS.filter(c => !S.kept.includes(c.id) && !S.skipped.includes(c.id) && matches(c));
const activeFilterCount = () => GROUPS.reduce((n,[g]) => n + S.filters[g].length, 0) + (S.matchNow ? 1 : 0);

/* ---------- deck ---------- */
const deckEl = document.getElementById("deck");
function renderDeck(){
  const cards = deckCards();
  deckEl.innerHTML = "";
  document.getElementById("undo").disabled = !S.history.length;
  document.getElementById("skip").disabled = document.getElementById("keep").disabled = !cards.length;
  if (!cards.length){
    const filtered = activeFilterCount() > 0;
    deckEl.innerHTML = `<div class="empty"><h2>${filtered ? "Nothing left for these conditions" : "You've been through the whole deck"}</h2>
      <p>${S.kept.length ? `${S.kept.length} kept for today.` : "Nothing kept yet."} ${filtered ? "Loosen the conditions or start the deck again." : "Start again to see every card."}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      ${S.kept.length ? `<button class="btn primary" data-go="kept">Open kept cards</button>` : ""}
      <button class="btn" data-reset="deck">Start the deck again</button>
      ${filtered ? `<button class="btn" data-open="filters">Change conditions</button>` : ""}</div></div>`;
    return;
  }
  cards.slice(0,2).reverse().forEach((c, i, arr) => {
    const el = document.createElement("article");
    el.className = "card" + (i < arr.length-1 ? " under" : "");
    el.dataset.id = c.id;
    el.innerHTML = cardHTML(c);
    deckEl.appendChild(el);
    initPlate(el, c);
  });
  attachSwipe(deckEl.lastElementChild);
}
function decide(dir){
  const top = deckEl.querySelector(".card:not(.under)");
  if (!top) return;
  const id = top.dataset.id;
  const w = window.innerWidth;
  top.classList.remove("snap"); top.classList.add("fling");
  top.style.transform = `translateX(${dir === "keep" ? w*1.2 : -w*1.2}px) rotate(${dir === "keep" ? 18 : -18}deg)`;
  top.style.opacity = "0";
  (dir === "keep" ? S.kept : S.skipped).push(id);
  S.history.push([dir, id]); if (S.history.length > 50) S.history.shift();
  save(); updateTabs();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(renderDeck, reduce ? 0 : 300);
}
function undo(){
  const last = S.history.pop(); if (!last) return;
  const [dir, id] = last;
  const arr = dir === "keep" ? S.kept : S.skipped;
  const i = arr.lastIndexOf(id); if (i > -1) arr.splice(i,1);
  save(); updateTabs(); renderDeck();
}
function attachSwipe(el){
  const keepS = el.querySelector(".stamp .keep"), skipS = el.querySelector(".stamp .skip");
  let x0=0, y0=0, dx=0, mode=null, pid=null;
  el.addEventListener("pointerdown", e => {
    if (e.target.closest("button:not(.tap),label,input,a")) return;   // gallery taps may still start a swipe
    x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; pid = e.pointerId; el.dragged = false;
    el.classList.remove("snap");
  });
  el.addEventListener("pointermove", e => {
    if (e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode){
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)*1.2){ mode = "h"; el.dragged = true; el.setPointerCapture(pid); }
      else if (Math.abs(my) > 10) mode = "v";
    }
    if (mode !== "h") return;
    dx = mx;
    el.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    const t = Math.min(1, Math.abs(dx)/110);
    keepS.style.opacity = dx > 0 ? t : 0; skipS.style.opacity = dx < 0 ? t : 0;
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    setTimeout(() => { el.dragged = false; });   // after the click that follows this pointerup
    if (mode === "h" && Math.abs(dx) > 100) return decide(dx > 0 ? "keep" : "skip");
    el.classList.add("snap"); el.style.transform = ""; keepS.style.opacity = skipS.style.opacity = 0;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

/* ---------- kept / all ---------- */
const listEl = document.getElementById("list");
function row(c, tag){
  return `<button class="row" data-read="${c.id}"><span class="thumb" data-thumb="${c.id}" style="background-image:linear-gradient(160deg,${c.palette.join(",")})"></span>
    <span><span class="t">${esc(c.title)}</span><br><span class="s">${esc(c.glance.when)}</span></span>${tag ? `<span class="tag">${tag}</span>` : ""}</button>`;
}
function renderList(){
  const kept = S.kept.map(byId).filter(Boolean);
  listEl.innerHTML = `
    <h2>Kept for today</h2>
    ${kept.length ? kept.map(c => row(c)).join("") : `<p class="note">Swipe right on a card in the deck to keep it here.</p>`}
    <h2>Portraits</h2>${CARDS.filter(c => c.kind === "Portrait").map(c => row(c, S.kept.includes(c.id) ? "Kept" : "")).join("")}
    <h2>Landscapes</h2>${CARDS.filter(c => c.kind === "Landscape").map(c => row(c, S.kept.includes(c.id) ? "Kept" : "")).join("")}
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">${kept.length ? `<button class="btn" data-reset="kept">Clear kept cards</button>` : ""}<button class="btn" data-reset="deck">Start the deck again</button></div>`;
  listEl.querySelectorAll("[data-thumb]").forEach(t => {
    firstSrc(byId(t.dataset.thumb)).then(u => { if (u) t.style.backgroundImage = `url("${u}")`; });
  });
}
function openReader(id){
  const c = byId(id);
  const wrap = document.createElement("div");
  wrap.className = "reader"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-label", c.title);
  wrap.innerHTML = `<div class="bar"><button class="icon-btn" data-close>Close</button>
    <button class="icon-btn" data-togglekeep="${id}">${S.kept.includes(id) ? "Remove from kept" : "Keep for today"}</button></div>
    <article class="card">${cardHTML(c)}</article>`;
  document.body.appendChild(wrap);
  initPlate(wrap, c);
  wrap.querySelector("[data-close]").focus();
}

/* ---------- tabs ---------- */
let view = "deck";
function updateTabs(){ document.getElementById("tabKept").textContent = S.kept.length ? `Kept (${S.kept.length})` : "Kept"; }
function show(v){
  view = v;
  document.getElementById("tabDeck").setAttribute("aria-selected", v === "deck");
  document.getElementById("tabKept").setAttribute("aria-selected", v === "kept");
  deckEl.classList.toggle("hidden", v !== "deck");
  listEl.classList.toggle("hidden", v !== "kept");
  document.getElementById("actions").classList.toggle("hidden", v !== "deck");
  v === "deck" ? renderDeck() : renderList();
}

/* ---------- conditions sheet ---------- */
function openFilters(){
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-label","Conditions");
  const draw = () => {
    const loc = S.loc || HOME;
    sh.innerHTML = `<h2>Conditions</h2>
      <p class="small">Pick what you have right now. Cards that don't fit are hidden from the deck.</p>
      <div class="group"><div class="chips"><button class="chip" data-now aria-pressed="${S.matchNow}">Match the light right now</button></div></div>
      ${GROUPS.map(([g,label,opts]) => `<div class="group"><span>${label}</span><div class="chips">${opts.map(([v,t]) =>
        `<button class="chip" data-g="${g}" data-v="${v}" aria-pressed="${S.filters[g].includes(v)}">${t}</button>`).join("")}</div></div>`).join("")}
      <div class="foot"><button class="btn primary" data-done>Show ${deckCards().length} card${deckCards().length === 1 ? "" : "s"}</button><button class="btn" data-clearf>Clear conditions</button></div>
      <div class="group"><span>Sun times are for ${esc(loc.label)}</span><div class="chips"><button class="chip" data-loc>Use my location</button>${S.loc ? `<button class="chip" data-home>Back to Montréal</button>` : ""}</div></div>
      <div class="group"><span>Offline</span><button class="btn" data-offline>Save all images for offline use</button><p class="small" data-offmsg>Do this once on Wi-Fi before a hike.</p></div>`;
  };
  draw();
  const close = () => { scrim.remove(); sh.remove(); updateFilterBtn(); if (view === "deck") renderDeck(); };
  scrim.onclick = close;
  sh.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.g){ const a = S.filters[b.dataset.g], i = a.indexOf(b.dataset.v); i > -1 ? a.splice(i,1) : a.push(b.dataset.v); save(); draw(); }
    else if (b.hasAttribute("data-now")){ S.matchNow = !S.matchNow; save(); draw(); }
    else if (b.hasAttribute("data-clearf")){ S.filters = defaults().filters; S.matchNow = false; save(); draw(); }
    else if (b.hasAttribute("data-done")) close();
    else if (b.hasAttribute("data-home")){ S.loc = null; save(); renderLight(); draw(); }
    else if (b.hasAttribute("data-loc")){
      b.textContent = "Locating…";
      navigator.geolocation?.getCurrentPosition(pos => { S.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, label: "your location" }; save(); renderLight(); draw(); },
        () => { b.textContent = "Location unavailable. Check permissions."; }, { timeout: 10000, maximumAge: 600000 });
    }
    else if (b.hasAttribute("data-offline")){
      const msg = sh.querySelector("[data-offmsg]"); b.disabled = true; let ok = 0;
      const jobs = CARDS.flatMap(c => gallery(c).map(im => [c, im]));
      for (const [c, im] of jobs){
        msg.textContent = `Saving ${ok+1} of ${jobs.length}: ${c.title}`;
        try { const u = im.legacy ? await firstSrc(c) : `img/${im.file}`; if (u){ await fetch(u, { mode: u.startsWith("http") ? "no-cors" : "same-origin" }); ok++; } } catch(e){}
      }
      msg.textContent = ok === jobs.length ? `All ${ok} images saved. The app works without signal now.` : `${ok} of ${jobs.length} saved. Try again on a better connection.`;
      b.disabled = false;
    }
  };
  document.body.append(scrim, sh);
  sh.querySelector("button").focus();
}
function updateFilterBtn(){
  const n = activeFilterCount(), b = document.getElementById("openFilters");
  b.textContent = n ? `Conditions (${n})` : "Conditions";
  b.setAttribute("aria-pressed", n > 0);
}

/* ---------- global events ---------- */
document.getElementById("tabDeck").onclick = () => show("deck");
document.getElementById("tabKept").onclick = () => show("kept");
document.getElementById("openFilters").onclick = openFilters;
document.getElementById("skip").onclick = () => decide("skip");
document.getElementById("keep").onclick = () => decide("keep");
document.getElementById("undo").onclick = undo;

document.addEventListener("change", e => {
  const i = e.target; if (!i.matches("input[data-card]")) return;
  const m = S.checks[i.dataset.card] = S.checks[i.dataset.card] || {};
  if (i.checked) m[i.dataset.key] = true; else delete m[i.dataset.key];
  save();
  document.querySelectorAll(`[data-prog="${i.dataset.card}"]`).forEach(p => p.textContent = progress(byId(i.dataset.card)));
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.step){
    if (b.closest(".card")?.dragged) return;   // the end of a swipe, not a tap
    const fig = b.closest(".plate");
    showImage(fig, byId(fig.dataset.gal), +fig.dataset.i + +b.dataset.step);
  }
  else if (b.dataset.clear){ delete S.checks[b.dataset.clear]; save();
    document.querySelectorAll(`input[data-card="${b.dataset.clear}"]`).forEach(i => i.checked = false);
    document.querySelectorAll(`[data-prog="${b.dataset.clear}"]`).forEach(p => p.textContent = ""); }
  else if (b.dataset.reset === "deck"){ S.skipped = []; S.history = S.history.filter(h => h[0] === "keep"); save(); show("deck"); }
  else if (b.dataset.reset === "kept"){ S.kept = []; S.history = S.history.filter(h => h[0] !== "keep"); save(); updateTabs(); renderList(); }
  else if (b.dataset.go === "kept") show("kept");
  else if (b.dataset.open === "filters") openFilters();
  else if (b.dataset.read) openReader(b.dataset.read);
  else if (b.hasAttribute("data-close")){ b.closest(".reader").remove(); if (view === "kept") renderList(); }
  else if (b.dataset.togglekeep){
    const id = b.dataset.togglekeep, i = S.kept.indexOf(id);
    if (i > -1) S.kept.splice(i,1); else { S.kept.push(id); S.skipped = S.skipped.filter(x => x !== id); }
    save(); updateTabs(); b.textContent = S.kept.includes(id) ? "Remove from kept" : "Keep for today";
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ const r = document.querySelector(".reader"); if (r){ r.remove(); if (view === "kept") renderList(); return; } document.querySelector(".scrim")?.click(); }
  if (view !== "deck" || document.querySelector(".reader,.sheet")) return;
  if (e.key === "ArrowRight") decide("keep");
  if (e.key === "ArrowLeft") decide("skip");
});

renderLight(); setInterval(() => { const before = currentPhase; renderLight(); if (S.matchNow && before !== currentPhase && view === "deck") renderDeck(); }, 60000);
updateTabs(); updateFilterBtn(); show("deck");

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
