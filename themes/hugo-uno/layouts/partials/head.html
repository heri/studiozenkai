<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <!-- Enable responsiveness on mobile devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title> {{ .Title }} &middot; {{ .Site.Params.Subtitle }} </title>
    {{ if .Description }}
      <meta name="description" content="{{ .Description }}">
    {{ else if .IsPage }}
      <meta name="description" content="{{ .Summary }}">
    {{ else }}
      <meta name="description" content="{{ .Site.Params.Subtitle }}">
    {{ end }}
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="{{ .Site.BaseURL }}/css/uno.css" />
    <link rel="stylesheet" type="text/css" href="{{ .Site.BaseURL }}/css/lightGallery.css" />
    <!-- Icons -->
    <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/apple-touch-icon-144-precomposed.png">
    <!-- WebMentions -->
    <link rel="webmention" href="https://webmention.io/studiozenkai.com/webmention" />
    <link rel="pingback" href="https://webmention.io/studiozenkai.com/xmlrpc" />
    <!-- Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ .Site.BaseURL }}/js/main.min.js">
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script>
      MathJax = {
        tex: {
          displayMath: [['\\[', '\\]'], ['$$', '$$']],  // block
          inlineMath: [['\\(', '\\)']]                  // inline
        }
      };
    </script>
</head>
